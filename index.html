<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4.2 NO FILTER</title><style>body{margin:0;background:#070A14;color:#fff;font-family:system-ui;padding:10px}h2{color:#D4AF37;text-align:center}.card{background:#0e162f;border:2px solid #D4AF37;border-radius:16px;padding:12px;margin:10px 0}.big{font-size:22px;font-weight:900;text-align:center;padding:12px;border-radius:12px}.buy{background:#00ff88;color:#000}.skip{background:#ff3333;color:#fff}.wait{background:#333}.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:900;margin-top:8px;background:#D4AF37;color:#000}table{width:100%;font-size:11px;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid #222}th{color:#D4AF37}.green{color:#00ff88}.red{color:#ff5555}#log{background:#000;padding:8px;border-radius:8px;font-size:11px;font-family:monospace;height:120px;overflow:auto;white-space:pre-wrap}</style></head><body>
<h2>🏆 V4.2 - ANTI ERROR</h2>
<div class="card"><b>💰 10 TOKEN TERBARU SOLANA</b><div class="big wait" id="totalPL">Loading...</div><div style="font-size:11px">Modal: <span id="modal">-</span> | Profit: <span id="profit">-</span> | Win: <span id="win">-</span></div><table><thead><tr><th>Token</th><th>Umur</th><th>5m%</th><th>PL</th></tr></thead><tbody id="tb"></tbody></table><button class="btn" onclick="load()">🔄 HITUNG ULANG</button></div>
<div class="card"><div id="name" style="font-weight:800">Loading...</div><div id="info" style="font-family:monospace;font-size:11px;background:#000;padding:8px;border-radius:8px;margin:6px 0">-</div><div class="big wait" id="dec">SCAN...</div><button class="btn" onclick="load()">🔄 CARI LAGI</button></div>
<div class="card"><b>LOG</b><div id="log">Start V4.2...
</div></div>
<script>
const log=t=>{let e=document.getElementById('log');e.textContent+=t+'\n';e.scrollTop=9999}
async function load(){
 try{
  log('Fetch DexScreener...');
  let r=await fetch('https://api.dexscreener.com/latest/dex/search?q=SOL');
  let j=await r.json();
  log('Dapat '+j.pairs.length+' pairs');
  if(!j.pairs||j.pairs.length==0) throw 'API kosong';
  let pairs=j.pairs.filter(p=>p.chainId==='solana').sort((a,b)=>b.pairCreatedAt-a.pairCreatedAt).slice(0,10);
  let html='';let totM=0,totP=0,win=0;
  pairs.forEach(p=>{
    let age=Math.floor((Date.now()-p.pairCreatedAt)/60000);
    let ageT=age>60?Math.floor(age/60)+'j':age+'m';
    let ch5=p.priceChange?.m5??p.priceChange?.h1??0;
    let profit=Math.round(50000*ch5/100 - 624);
    if(ch5>=100) profit=50000-624;
    if(ch5<=-30) profit=Math.round(-15000-624);
    totM+=50000;totP+=profit;if(profit>0) win++;
    html+=`<tr><td>${p.baseToken.symbol.slice(0,10)}</td><td>${ageT}</td><td class="${ch5>=0?'green':'red'}">${ch5}%</td><td class="${profit>0?'green':'red'}">${profit}</td></tr>`;
  });
  document.getElementById('tb').innerHTML=html;
  document.getElementById('modal').innerText='Rp'+totM.toLocaleString();
  document.getElementById('profit').innerText='Rp'+totP.toLocaleString();
  document.getElementById('win').innerText=win+'/10';
  let el=document.getElementById('totalPL');
  if(totP>0){el.className='big buy';el.innerText='PROFIT Rp'+totP.toLocaleString();}
  else{el.className='big skip';el.innerText='RUGI Rp'+totP.toLocaleString();}

  let p0=pairs[0];
  document.getElementById('name').innerText=p0.baseToken.symbol+' - '+p0.baseToken.name;
  document.getElementById('info').innerText=`${p0.baseToken.symbol} | Harga $${p0.priceUsd}\nLiq $${Math.round(p0.liquidity?.usd||0)} | 5m ${p0.priceChange?.m5||0}% | Umur ${Math.floor((Date.now()-p0.pairCreatedAt)/60000)}m\n${p0.baseToken.address}\nhttps://dexscreener.com/solana/${p0.pairAddress}`;
  let dec=document.getElementById('dec');
  if((p0.priceChange?.m5||0)>-20){dec.className='big buy';dec.innerText='🚀 GAS BELI'}else{dec.className='big skip';dec.innerText='⛔ SKIP'}
  log('SUKSES - Profit Rp'+totP);
 }catch(e){
  log('ERROR: '+e);
  document.getElementById('totalPL').innerText='ERROR: '+e;
  document.getElementById('info').innerText='Error: '+e+' - coba klik HITUNG ULANG atau ganti jaringan';
 }
}
load();
</script></body></html>
